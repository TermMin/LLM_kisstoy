[mcp_servers.kisstoy_devices]
url = "http://127.0.0.1:3000/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 45
default_tools_approval_mode = "approve"

[mcp_servers.kisstoy_devices.tools.arm_control]
approval_mode = "prompt"

[mcp_servers.kisstoy_devices.tools.stop_all]
approval_mode = "approve"
